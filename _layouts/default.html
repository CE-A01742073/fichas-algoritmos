<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.nombre %}{{ page.nombre_corto }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/estilo.css' | relative_url }}">
</head>
<body>
  <main class="pizarron">
    {{ content }}
  </main>
  <footer class="pie">
    {{ site.autor }} · {{ site.materia }} · {{ site.periodo }}
  </footer>
  <script src="{{ '/assets/js/pestanas.js' | relative_url }}"></script>
</body>
</html>
